name: CI

# apex-kit-browser CI —— 两道防线：
#   1. build-test：库自身三模块编译 + 单测 + publishToMavenLocal 可发布性
#   2. consumer-check：跨仓库验证宿主 Android-Guru-Agent 仍能编译（防下游崩，
#      F6 跨仓库 CI 漂移的解法）—— 库的每次 PR 都对宿主 :app:compileDebugKotlin
#      跑一遍，坏下游立刻看到。
#
# 宿主消费方式（E1 迁移期 composite build）：宿主 settings.gradle.kts 里有
# 条件 includeBuild —— 当兄弟目录 ../apex-kit-browser 存在时接入并按坐标
# com.apex.browser:{browser-core,browser-engine,browser-chrome} 自动替换。
# 本 workflow 把两个仓库 checkout 成兄弟布局，正好命中该条件。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test (3 modules)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure pre-installed Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build all modules (compile only first for fast feedback)
        run: ./gradlew assemble --no-daemon --stacktrace

      # 纯 JVM 测试必须独立跑（browser-core 零 Android 依赖的可执行证明）
      - name: browser-core pure-JVM tests
        run: ./gradlew :browser-core:test --no-daemon

      - name: browser-engine unit tests
        run: ./gradlew :browser-engine:testDebugUnitTest --no-daemon

      - name: browser-chrome unit tests
        run: ./gradlew :browser-chrome:testDebugUnitTest --no-daemon

      # E2 可发布性验证：坐标/POM 生成必须完整（发布到 GitHub Packages 的前置检查）
      # 版本号从 browser-core/build.gradle.kts 动态读取（v1.1.0 起不再硬编码——
      # 升版本忘改这里的检查会误报 missing）
      - name: publishToMavenLocal smoke check
        run: |
          ./gradlew publishToMavenLocal --no-daemon
          VER=$(grep -m1 '^version = "' browser-core/build.gradle.kts | sed 's/version = "//;s/"//')
          echo "smoke-checking com.apex.browser:*:$VER"
          for a in browser-core browser-engine browser-chrome; do
            if ls ~/.m2/repository/com/apex/browser/$a/$VER/$a-$VER.{module,pom} >/dev/null 2>&1; then
              echo "✅ com.apex.browser:$a:$VER published to mavenLocal"
            else
              echo "❌ com.apex.browser:$a:$VER missing in mavenLocal"; exit 1
            fi
          done

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7

  consumer-check:
    name: Consumer Check (host app compiles)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # 兄弟布局：host-app/ + apex-kit-browser/ —— 宿主的条件 includeBuild 命中
      # （改名过渡：新名检出 + 旧名顶层别名，宿主新旧探针恒命中）
      - name: Checkout apex-kit-browser
        uses: actions/checkout@v7
        with:
          path: apex-kit-browser

      - name: Checkout host app (Android-Guru-Agent)
        uses: actions/checkout@v7
        with:
          repository: Ultra-Guru/Android-Guru-Agent
          path: host-app
          # 公开仓库只读 checkout，无需 PAT

      # ── 兄弟库补齐检出（宿主多库 composite build 全量接线）──────────────────
      # 宿主 settings.gradle.kts 同时条件接线三个 kit（browser/standard/workspace）
      # 且 com.apex.* 坐标无任何远端仓库可解析 —— 缺任何一个兄弟目录，宿主 app 的
      # 依赖解析直接失败（PR #19 首次暴露：workspace/standard 缺件 →
      # "Could not find com.apex.workspace:workspace-core"）。按「宿主 lock 优先、
      # 缺锁回退 main」钉住兄弟库版本 —— 与宿主自身 CI 的 pinned checkout 同源，
      # 保证消费验证可复现（被测库 = 本 PR 检出；兄弟库 = 宿主锁定的已知好版本）。
      - name: Resolve sibling kit pins from host locks
        id: host-pins
        run: |
          set -euo pipefail
          STD=$(head -n 1 host-app/gradle/standard-kit.lock 2>/dev/null || echo main)
          WSP=$(head -n 1 host-app/gradle/workspace-kit.lock 2>/dev/null || echo main)
          echo "standard-kit=$STD" >> "$GITHUB_OUTPUT"
          echo "workspace-kit=$WSP" >> "$GITHUB_OUTPUT"
          echo "sibling pins: standard-kit=${STD:0:12} workspace-kit=${WSP:0:12}"

      - name: Checkout apex-standard-kit (pinned by host lock)
        uses: actions/checkout@v7
        with:
          repository: Ultra-Guru/apex-standard-kit
          path: apex-standard-kit
          ref: ${{ steps.host-pins.outputs.standard-kit }}

      - name: Checkout apex-workspace-kit (pinned by host lock)
        uses: actions/checkout@v7
        with:
          repository: Ultra-Guru/apex-workspace-kit
          path: apex-workspace-kit
          ref: ${{ steps.host-pins.outputs.workspace-kit }}

      - name: Alias sibling kit dirs (rename transition) + verify wiring
        run: |
          # 符号链接 target 按链接所在目录（workspace 根）解析 —— 裸名，勿加前缀
          # 旧名别名：宿主 ../apex-browser-kit 探针（改名前命中）
          ln -s apex-kit-browser apex-browser-kit
          # 新名别名：宿主 ../apex-kit-standard|apex-kit-workspace 探针（宿主联动 PR 合并后命中）
          ln -s apex-standard-kit apex-kit-standard
          ln -s apex-workspace-kit apex-kit-workspace
          ls -la | grep -E "apex-(kit-)?(browser|standard|workspace)"
          # 接线校验：新旧任一形态在即算接通
          for pair in apex-browser-kit:apex-kit-browser \
                     apex-standard-kit:apex-kit-standard \
                     apex-workspace-kit:apex-kit-workspace; do
            OLD="${pair%%:*}"; NEW="${pair##*:}"
            if ! grep -qE "$OLD|$NEW" host-app/settings.gradle.kts; then
              echo "::error::宿主 settings.gradle.kts 缺少 $OLD / $NEW 的 includeBuild 接线（composite build 前置条件）"
              exit 1
            fi
          done
          echo "✅ 宿主已包含三 kit 条件 includeBuild 接线（browser/standard/workspace，新旧名任一形态）"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure pre-installed Android SDK (+ NDK for host native deps)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973" >/dev/null 2>&1 || \
          yes | $ANDROID_HOME/tools/bin/sdkmanager "ndk;27.0.12077973" >/dev/null 2>&1 || \
          echo "⚠️ Could not install NDK 27.0.12077973, will try with pre-installed"
          ls "$ANDROID_HOME/ndk/" 2>/dev/null || echo "No NDK pre-installed"
          echo "sdk.dir=$ANDROID_HOME" > host-app/local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify composite build substitution resolves
        working-directory: host-app
        run: |
          ./gradlew :app:dependencies \
            --configuration debugCompileClasspath \
            --stacktrace 2>&1 | tee deps.log
          echo "── com.apex.browser 解析结果 ──"
          grep -E "com\.apex\.browser" deps.log | head -20 || {
            echo "::error::debugCompileClasspath 未解析到 com.apex.browser:*（composite build 替换失败）"
            exit 1
          }

      - name: Compile host app with this lib version
        working-directory: host-app
        run: |
          ./gradlew :app:compileDebugKotlin \
            --no-daemon \
            -Pkotlin.incremental=false \
            --stacktrace

      - name: Host unit tests (app + tool-registry)
        working-directory: host-app
        run: |
          ./gradlew :app:testDebugUnitTest :core:tool-registry:test \
            --no-daemon \
            -Pkotlin.incremental=false \
            --stacktrace
