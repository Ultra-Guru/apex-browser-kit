name: Dependency Submission

# Feeds GitHub's dependency graph from Gradle's own resolution, so Dependabot
# alerts fire for TRANSITIVE dependencies we never declare by hand
# (kotlinx-serialization pulling in something, a transitive AndroidX artifact, …).
#
# This is the single highest-value supply-chain line for a *published* library:
# consumers depend on our coordinates, so a vulnerable transitive reaches them
# through us. Free, one step, no Android SDK (it only runs `./gradlew` resolvers).
#
# Pattern follows detekt's gradle-dependency-submission.yaml.
# Reference: https://github.com/gradle/actions/tree/main/dependency-submission

on:
  # push-to-main only, deliberately.
  #
  # Two things learned from the first run of this workflow:
  #   1. The dependency-graph API rejects submissions on `pull_request` events
  #      (HttpError even with `contents: write`), so a PR-triggered run is a
  #      guaranteed red check that tells us nothing.
  #   2. `gradle/actions/dependency-submission` has no `package-ecosystem`
  #      input (that belongs to Dependabot configs); passing it is an
  #      "Unexpected input(s)" warning.
  # Matches detekt's gradle-dependency-submission.yaml, which is push-to-main too.
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  dependency-submission:
    name: Gradle dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure pre-installed Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Submit dependency graph
        # continue-on-error（rebase 修复）：依赖图提交依赖仓库的 Dependency graph
        # 数据服务开关（Settings → 数据服务/依赖图）—— 仓库侧未开启时 API 拒收
        # （"The Dependency graph is disabled for this repository"），但这是
        # 数据洞察链路而非构建门禁：绝不应让它把 push main 染红、进而挡住
        # notify-host → 宿主 sync 的全绿判定。开启仓库设置后提交即自动生效。
        # 产物（JSON 快照）仍作为 artifact 上传，开启后可回溯。
        uses: gradle/actions/dependency-submission@v4
        continue-on-error: true